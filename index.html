<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Visualisasi Koordinat Bola (Spherical Coordinates)</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #1e293b; color: white; }
        #canvas-container { width: 70vw; height: 100vh; float: left; }
        #sidebar { width: 30vw; height: 100vh; float: right; padding: 20px; box-sizing: border-box; background: #0f172a; overflow-y: auto; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type=range] { width: 100%; }
        .math-box { background: #334155; padding: 10px; border-radius: 5px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="sidebar">
        <h2>Spherical Coordinates</h2>
        <p>Titik P(r, &theta;, &phi;)</p>
        
        <div class="control-group">
            <label>Radius (r): <span id="val-r">2.00</span></label>
            <input type="range" id="range-r" min="0.5" max="4.0" step="0.01" value="2.0">
        </div>

        <div class="control-group">
            <label>Sudut &theta; (Elevation): <span id="val-theta">55</span>&deg;</label>
            <input type="range" id="range-theta" min="0" max="180" step="1" value="55">
        </div>

        <div class="control-group">
            <label>Sudut &phi; (Azimuth): <span id="val-phi">65</span>&deg;</label>
            <input type="range" id="range-phi" min="0" max="360" step="1" value="65">
        </div>

        <div class="math-box">
            <h3>1. To Cartesian</h3>
            <p id="cartesian-result">x = 0.69, y = 1.48, z = 1.15</p>
        </div>
    </div>

    <!-- Memuat Three.js untuk Grafik 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Inisialisasi Scene, Camera, dan Renderer Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdbeafe);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Tambahkan Pencahayaan & Sumbu Koordinat
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const axesHelper = new THREE.AxesHelper(3);
        scene.add(axesHelper);

        // Buat Bola & Titik Koordinat (Placeholder Sederhana)
        const sphereGeo = new THREE.SphereGeometry(2, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd, wireframe: true, transparent: true, opacity: 0.3 });
        const wireSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(wireSphere);

        // Titik P
        const pointGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const pointMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
        const pointMesh = new THREE.Mesh(pointGeo, pointMat);
        scene.add(pointMesh);

        // Elemen UI
        const rangeR = document.getElementById('range-r');
        const rangeTheta = document.getElementById('range-theta');
        const rangePhi = document.getElementById('range-phi');
        
        const valR = document.getElementById('val-r');
        const valTheta = document.getElementById('val-theta');
        const valPhi = document.getElementById('val-phi');
        const cartResult = document.getElementById('cartesian-result');

        function updateCoordinates() {
            let r = parseFloat(rangeR.value);
            let thetaDeg = parseFloat(rangeTheta.value);
            let phiDeg = parseFloat(rangePhi.value);

            valR.innerText = r.toFixed(2);
            valTheta.innerText = thetaDeg;
            valPhi.innerText = phiDeg;

            // Konversi derajat ke radian
            let theta = thetaDeg * (Math.PI / 180);
            let phi = phiDeg * (Math.PI / 180);

            // Rumus Kartesius
            let x = r * Math.sin(theta) * Math.cos(phi);
            let y = r * Math.sin(theta) * Math.sin(phi); // Di Three.js sumbu Y biasanya ke atas, sesuaikan dengan konvensi grafis
            let z = r * Math.cos(theta);

            // Update posisi titik di 3D (Perhatikan pemetaan sumbu di Three.js: Y ke atas, Z ke depan)
            pointMesh.position.set(x, z, y); 

            cartResult.innerText = `x = ${x.toFixed(2)}, y = ${y.toFixed(2)}, z = ${z.toFixed(2)}`;
        }

        rangeR.addEventListener('input', updateCoordinates);
        rangeTheta.addEventListener('input', updateCoordinates);
        rangePhi.addEventListener('input', updateCoordinates);

        updateCoordinates();

        // Loop Animasi Render
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
